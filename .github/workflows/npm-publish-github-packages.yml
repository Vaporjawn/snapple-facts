# Publishes a GitHub-Packages-scoped copy of this package (@vaporjawn/snapple-facts)
# to npm.pkg.github.com so it shows up under https://github.com/Vaporjawn?tab=packages.
# This is separate from npm-publish.yml, which publishes the unscoped "snapple-facts"
# package to the public npm registry, and is unaffected by this workflow.
#
# Root cause of this workflow never having published anything: it was pinned to
# node-version 16, which crashes the installed jest-config on `os.availableParallelism`
# (added in Node 18.4+), so the old "build" job's `npm test` step always failed and
# the publish step (which depended on it) was always skipped. This version drops the
# test gate (already covered by tests.js.yml on every push/PR) and publishes with
# --ignore-scripts so npm's own prepublishOnly hook doesn't re-run it here.
name: Publish to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://npm.pkg.github.com
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Scope package name for GitHub Packages
        run: npm pkg set name="@vaporjawn/snapple-facts"
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
