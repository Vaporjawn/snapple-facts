name: Dependabot Issue & Project Tracker

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  track:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR to Vaporjawn
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" \
            --repo "$REPO" \
            --add-assignee Vaporjawn

      - name: Ensure "dependencies" label exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create dependencies --repo "$REPO" --color "0366d6" --description "Dependency updates" 2>/dev/null || true

      - name: Create linked tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          ISSUE_URL=$(gh issue create \
            --repo "$REPO" \
            --title "Dependabot: $PR_TITLE" \
            --body "Tracks dependency update PR #$PR_NUMBER: $PR_URL" \
            --assignee Vaporjawn \
            --label dependencies)
          echo "url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "number=$(basename "$ISSUE_URL")" >> "$GITHUB_OUTPUT"

      - name: Link issue on the PR (auto-closes issue when PR merges)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          BODY=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body -q .body)
          printf '%s\n\nCloses #%s\n' "$BODY" "$ISSUE_NUMBER" > /tmp/new_body.md
          gh pr edit "$PR_NUMBER" --repo "$REPO" --body-file /tmp/new_body.md

      - name: Add PR and issue to "My Work" project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PROJECT_TOKEN secret not set on this repo - skipping project linking."
            exit 0
          fi
          PROJECT_ID="PVT_kwHOAO97Sc4BfH9E"
          ISSUE_NODE_ID=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER" -q .node_id)
          gh api graphql -f query='mutation($project:ID!, $item:ID!){ addProjectV2ItemById(input:{projectId:$project, contentId:$item}){ item { id } } }' -f project="$PROJECT_ID" -f item="$PR_NODE_ID"
          gh api graphql -f query='mutation($project:ID!, $item:ID!){ addProjectV2ItemById(input:{projectId:$project, contentId:$item}){ item { id } } }' -f project="$PROJECT_ID" -f item="$ISSUE_NODE_ID"
