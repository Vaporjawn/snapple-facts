<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Snapple Facts bottle cap mark">
  <defs>
    <radialGradient id="capBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff6b57"/>
      <stop offset="55%" stop-color="#e6301e"/>
      <stop offset="100%" stop-color="#a3160a"/>
    </radialGradient>
    <linearGradient id="capRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#f2b705"/>
