  <circle cx="32" cy="32" r="25" fill="url(#capBody)"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#ffdfa0" stroke-width="1.25" opacity="0.6"/>

  <text x="32" y="39" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic"
